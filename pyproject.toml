[project]
name = "argus"
version = "0.1.0"
description = "Autonomous IDOR/BAC agent that proves findings by generating and executing real exploits in isolation."
requires-python = ">=3.11"
dependencies = [
    "flask==3.1.3",
    "pyyaml==6.0.3",
    "openai==3.24.0",
    "langgraph==1.2.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
